    const av = a[state.sort] || '';
    const bv = b[state.sort] || '';
    return state.dir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
  });
  return rows;
}

  return `<span class="chip ${cls}">${label} · ${text}</span>`;

    const r = allRequests().find((x) => x.id === state.drawerId);
    if (!r) { state.drawerId = null; }
    else {
      const status = r.status === 'active' ? 'Активна' : r.status === 'approved' ? 'Согласовано' : 'Отклонено';
      root.innerHTML = `<div class="drawer-back" data-action="close"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><button class="linkish" type="button" data-action="close">Закрыть</button><h2 id="drawer-title">${esc(r.id)}</h2><span class="status ${r.status}">${status}</span><div class="kv"><span>Объект</span><b>Hive core.dim_account_h</b><span>Автор</span><b>${esc(r.author)}</b><span>Кому</span><b>${esc(r.recipients.join(', '))}</b><span>Когда</span><b>${fmt(r.iso)}</b><span>Гранты</span><b>${esc(r.grants.join(', '))}</b><span>Зачем</span><b>${esc(r.purpose)}</b><span>Срок</span><b>${esc(r.term)}</b></div><p style="margin-top:12px">${esc(r.comment)}</p><div class="callout">${esc(r.decision)}</div>${r.status === 'rejected' ? '<div class="modal-actions"><span></span><button class="btn btn-primary" type="button" data-action="request">Подать снова</button></div>' : ''}</aside></div>`;
      return;
    }
  }
  if (state.modal === 'tour') {
    const slides = [
      ['Сначала ответ, потом таблица', 'Полоса над вкладками говорит, выполнится ли запрос к Hive. Открытая карточка сама по себе этого не гарантирует.'],
      ['Гранты — про источник', 'SELECT и READ относятся к prod-cluster.core.dim_account_h. Роль в DataHub их не заменяет. Если есть только SELECT, запрос всё равно может упасть.'],
      ['Если права нет — один следующий шаг', 'Кнопка называет конкретное действие: открыть уже созданную заявку, запросить READ или показать, как подключиться. Повторную заявку прототип не даёт отправить.']
    ];
    const [title, text] = slides[state.tourStep - 1];
    root.innerHTML = `<div class="backdrop" data-action="close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="tour-title"><div class="kicker">Шаг ${state.tourStep} из 3</div><h2 id="tour-title">${title}</h2><p class="muted">${text}</p><div class="modal-actions"><button class="btn btn-ghost" type="button" data-action="close">Закрыть</button><button class="btn btn-primary" type="button" data-action="tour-next">${state.tourStep === 3 ? 'Открыть гранты' : 'Дальше'}</button></div></div></div>`;
    return;
  }
  if (state.modal === 'connect') {
    const blocked = !canRead();
    root.innerHTML = `<div class="backdrop" data-action="close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="conn-title"><button class="linkish" type="button" data-action="close">Закрыть</button><h2 id="conn-title">Подключение к Hive</h2>${blocked ? '<div class="error-box">Сейчас команда не сработает: ' + (has('SELECT') ? 'нет READ на файлы.' : 'нет SELECT и READ.') + '</div>' : '<div class="callout">Грантов на чтение достаточно. Каталог для входа не используется.</div>'}<label class="field">Beeline<pre class="sql">beeline -u 'jdbc:hive2://prod-cluster:10000/core' -n ${esc(scenario().login)} -e "select account_id from dim_account_h limit 20"</pre></label><div class="modal-actions"><button class="btn btn-ghost" type="button" data-action="copy" data-copy="beeline -u jdbc:hive2://prod-cluster:10000/core -n ${scenario().login}">Копировать</button><button class="btn btn-primary" type="button" data-action="close">Понятно</button></div></div></div>`;
    return;
  }
  if (state.modal === 'steward') {
    const missing = PRIVS.filter((p) => p.bundle === 'read' && !has(p.id)).map((p) => p.id);
    const text = `Здравствуйте! Нужен доступ на чтение к Hive prod-cluster.core.dim_account_h. Сейчас не хватает: ${missing.length ? missing.join(', ') : 'ничего из чтения'}. ${myOpen() ? 'Заявка ' + myOpen().id + ' уже открыта.' : ''} Подскажите, чего не хватает для согласования.`;
    root.innerHTML = `<div class="backdrop" data-action="close"><form class="modal" id="steward-form" role="dialog" aria-modal="true" aria-labelledby="st-title"><button class="linkish" type="button" data-action="close">Закрыть</button><h2 id="st-title">Спросить Data Steward</h2><p class="muted">Сообщение уже содержит источник и недостающие гранты, чтобы не пересказывать карточку.</p><label class="field">Кому<span class="muted">anna.steward · Data Stewards</span></label><label class="field">Сообщение<textarea id="steward-text">${esc(text)}</textarea></label><div class="modal-actions"><button class="btn btn-ghost" type="button" data-action="close">Отмена</button><button class="btn btn-primary" type="submit">Отправить</button></div></form></div>`;
    return;
  }
  if (state.modal === 'request') {
    const titles = ['', 'Куда просите доступ', 'Какие гранты нужны', 'Зачем и на какой срок', 'Проверьте перед отправкой', 'Заявка создана'];
    let body = '';
    if (state.modalStep === 1) body = `<div class="passport"><h3>Hive · prod-cluster.core.dim_account_h</h3><p class="muted">Это таблица в СУБД, не карточка датасета и не роль в DataHub. После согласования права появятся в Ranger.</p></div>`;
    if (state.modalStep === 2) body = choiceHtml();
    if (state.modalStep === 3) body = `<label class="field">Задача<select id="f-purpose">${PURPOSES.map((p) => `<option value="${p[0]}" ${state.purpose === p[0] ? 'selected' : ''}>${p[1]}</option>`).join('')}</select></label><label class="field">Срок<select id="f-term">${['30', '90', '180'].map((d) => `<option value="${d}" ${state.term === d ? 'selected' : ''}>${d} дней</option>`).join('')}</select></label><label class="field">Комментарий для стюарда<textarea id="f-comment">${esc(state.comment)}</textarea></label><p class="muted">Напишите, какую задачу закроет доступ. Фразы «нужен доступ» недостаточно — такие заявки отклоняют.</p>`;
    if (state.modalStep === 4) {
      const danger = state.selected.some((id) => ['DROP', 'CREATE', 'INDEX', 'LOCK'].includes(id));
      body = `<div class="kv"><span>Объект</span><b>Hive core.dim_account_h</b><span>Кто просит</span><b>${esc(scenario().user)}</b><span>Гранты</span><b>${esc(state.selected.join(', ') || '—')}</b><span>Задача</span><b>${esc(purposeLabel(state.purpose))}</b><span>Срок</span><b>${esc(state.term)} дней</b><span>Согласует</span><b>Data Stewards · anna.steward</b></div><p style="margin-top:10px">${esc(state.comment)}</p>${danger ? `<label class="choice" style="margin-top:10px"><input id="f-danger" type="checkbox" ${state.dangerOk ? 'checked' : ''} /><span><strong>Понимаю, что это административные права</strong><small>DROP удалит таблицу для всех пользователей источника.</small></span></label>` : '<p class="callout">Административные гранты не выбраны. Так заявка проще согласуется.</p>'}`;
    }
    if (state.modalStep === 5) body = `<div class="callout"><strong>${esc(state.pending.id)} создана.</strong> Статус — Активна. Гранты на вкладке появятся только после согласования и паузы Ranger, не сразу.</div><ol class="steps"><li class="done"><span class="step-n">✓</span><div>Заявка на источник, не на датасет</div></li><li class="now"><span class="step-n">2</span><div>Согласование Data Stewards, около 2 рабочих дней</div></li><li><span class="step-n">3</span><div>Выдача роли и проверка запроса</div></li></ol>`;
    const nextLabel = state.modalStep === 4 ? 'Отправить заявку' : state.modalStep === 5 ? 'Открыть заявку' : 'Дальше';
    root.innerHTML = `<div class="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="req-title"><div class="kicker">Запрос грантов на источник</div><h2 id="req-title">${titles[state.modalStep]}</h2><div class="steps-bar">${[1, 2, 3, 4].map((n) => `<span class="${n <= Math.min(state.modalStep, 4) ? 'on' : ''}"></span>`).join('')}</div>${body}<div class="modal-actions"><button class="btn btn-ghost" type="button" data-action="${state.modalStep === 1 || state.modalStep === 5 ? 'close' : 'back'}">${state.modalStep === 5 ? 'Остаться' : 'Назад'}</button><button class="btn btn-primary" type="button" data-action="next">${nextLabel}</button></div></div></div>`;
    return;
  }
  root.innerHTML = '';
}
function render() {
  const canvas = document.getElementById('canvas');
  const scroll = canvas.scrollTop;
  renderChrome();
  renderPage();
  renderSummary();
  renderOverlay();
  const jump = state.scrollTo;
  state.scrollTo = null;
  if (jump) requestAnimationFrame(() => document.getElementById(jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  else canvas.scrollTop = scroll;
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function readForm() {
  const purpose = document.getElementById('f-purpose');
  const term = document.getElementById('f-term');
  const comment = document.getElementById('f-comment');
  const danger = document.getElementById('f-danger');
  if (purpose) state.purpose = purpose.value;
  if (term) state.term = term.value;
  if (comment) state.comment = comment.value;
  if (danger) state.dangerOk = danger.checked;
  state.selected = [...document.querySelectorAll('[data-grant]:checked')].map((el) => el.dataset.grant);
  if (!state.selected.length && state.modalStep !== 2) {
    /* keep previous selection when the checkboxes are not on this step */
    state.selected = state.selectedDraft || state.selected;
  }
  if (document.querySelector('[data-grant]')) state.selectedDraft = state.selected.slice();
}
function openRequest() {
  const open = myOpen();
  if (open && state.scenario === 'none') {
    state.drawerId = open.id;
    state.modal = null;
    state.tab = 'requests';
    toast('Заявка ' + open.id + ' уже есть — новая не нужна');
    render();
    return;
  }
  if (open && state.scenario === 'select' && open.grants.includes('READ')) {
    state.drawerId = open.id;
    state.modal = null;
    render();
    return;
  }
  const missing = PRIVS.filter((p) => p.bundle === 'read' && !has(p.id)).map((p) => p.id);
  state.selected = missing;
  state.selectedDraft = missing.slice();
  state.purpose = 'report';
  state.term = '90';
  state.comment = defaultComment();
  state.dangerOk = false;
  state.modal = 'request';
  state.modalStep = 1;
  state.drawerId = null;
  render();
}
function submitRequest() {
  readForm();
  const grants = (state.selectedDraft || state.selected).filter((id) => !has(id));
  if (!grants.length) { toast('Отметьте грант, которого ещё нет'); state.modalStep = 2; render(); return; }
  if (grants.some((id) => ['DROP', 'CREATE', 'INDEX', 'LOCK'].includes(id)) && !state.dangerOk) {
    toast('Подтвердите административные гранты или снимите их');
    return;
  }
  const id = 'ACC-' + (1100 + Math.floor(Math.random() * 800));
  state.pending = { id, userKey: state.scenario, status: 'active', author: scenario().user, recipients: [scenario().user], iso: '2026-10-30T15:10:00', grants, purpose: purposeLabel(state.purpose), term: state.term + ' дней', comment: state.comment.trim(), decision: 'Ждёт согласования Data Stewards. Гранты в Hive появятся после согласия.' };
  state.modalStep = 5;
  state.tab = 'grants';
  render();
}
function onClick(e) {
  if (e.target.id === 'dl') return;
  const helpBtn = e.target.closest('[data-action="toggle-help"]');
  const inHelp = e.target.closest('#help-pop');
  if (!helpBtn && !inHelp && state.helpOpen) state.helpOpen = false;
  const viewBtn = e.target.closest('[data-action="toggle-views"]');
  if (!viewBtn && !e.target.closest('#views-pop') && state.viewsOpen) state.viewsOpen = false;
  const el = e.target.closest('[data-action]');
  if (!el) { renderChrome(); return; }
  const action = el.dataset.action;
  if (action === 'close' && e.target !== el && !e.target.closest('.linkish') && el.classList.contains('backdrop') === false && el.classList.contains('drawer-back') === false) {
    /* inner clicks on dialog should not close; backdrop handler below */
  }
  if ((el.classList.contains('backdrop') || el.classList.contains('drawer-back')) && e.target !== el) return;
  if (action === 'collapse-nav') state.navCollapsed = !state.navCollapsed;
  else if (action === 'toggle-summary') state.summaryOpen = !state.summaryOpen;
  else if (action === 'toggle-help') state.helpOpen = !state.helpOpen;
  else if (action === 'toggle-views') state.viewsOpen = !state.viewsOpen;
  else if (action === 'route') { state.route = el.dataset.route; if (el.dataset.tab) state.tab = el.dataset.tab; state.modal = null; state.drawerId = null; }
  else if (action === 'tab') state.tab = el.dataset.tab;
  else if (action === 'scenario') {
    state.scenario = el.dataset.scenario;
    state.pending = null;
    state.page = 1;
    state.ranQuery = null;
    state.drawerId = null;
    if (el.dataset.go) { state.route = 'dataset'; state.tab = 'grants'; }
  }
  else if (action === 'show-steps') { state.tab = 'grants'; state.scrollTo = 'grant-details'; }
  else if (action === 'request') openRequest();
  else if (action === 'open-mine') { const open = myOpen(); if (open) { state.drawerId = open.id; state.modal = null; } }
  else if (action === 'connect') { state.modal = 'connect'; state.drawerId = null; }
  else if (action === 'steward') { state.modal = 'steward'; state.drawerId = null; }
  else if (action === 'tour') { state.modal = 'tour'; state.tourStep = 1; state.drawerId = null; state.helpOpen = false; }
  else if (action === 'tour-next') {
    if (state.tourStep < 3) state.tourStep += 1;
    else { state.modal = null; state.route = 'dataset'; state.tab = 'grants'; }
  }
  else if (action === 'close') { state.modal = null; state.drawerId = null; }
  else if (action === 'back') { readForm(); state.modalStep = Math.max(1, state.modalStep - 1); }
  else if (action === 'next') {
    if (state.modal === 'request' && state.modalStep === 5) {
      state.modal = null;
      state.drawerId = state.pending && state.pending.id;
      state.tab = 'requests';
    } else if (state.modal === 'request' && state.modalStep === 3) {
      readForm();
      if (state.comment.trim().length < 10) { toast('Опишите задачу — без этого заявку отклоняют'); return; }
      state.modalStep = 4;
    } else if (state.modal === 'request' && state.modalStep === 2) {
      readForm();
      if (!(state.selectedDraft || []).filter((id) => !has(id)).length) { toast('Отметьте грант, которого ещё нет'); return; }
      state.modalStep = 3;
    } else if (state.modal === 'request' && state.modalStep === 4) {
      submitRequest();
      return;
    } else if (state.modal === 'request') state.modalStep += 1;
    render();
    return;
  }
  else if (action === 'open-request') { state.drawerId = el.dataset.id; state.modal = null; }
  else if (action === 'filter') { state.filter = el.dataset.filter; state.page = 1; }
  else if (action === 'page') { const p = Number(el.dataset.page); const pages = Math.max(1, Math.ceil(visibleRequests().length / state.pageSize)); if (p >= 1 && p <= pages) state.page = p; }
  else if (action === 'sort') { if (state.sort === el.dataset.sort) state.dir = state.dir === 'asc' ? 'desc' : 'asc'; else { state.sort = el.dataset.sort; state.dir = 'asc'; } }
  else if (action === 'excel') exportCsv();
  else if (action === 'copy') copyText(el.dataset.copy);
  else if (action === 'toast') toast(el.dataset.msg);
  else if (action === 'view') { state.view = el.dataset.view; state.viewsOpen = false; toast(state.view === 'All' ? 'Показаны все активы' : 'Представление «' + state.view + '». Таблица в него входит, гранты не меняются.'); }
  else if (action === 'pick-dataset') { state.searchOpen = false; if (el.dataset.here === 'true') { state.route = 'dataset'; state.tab = 'grants'; } else toast('В прототипе открыта только dim_account_h. У соседних таблиц свои гранты.'); }
  else if (action === 'run-query') { state.ranQuery = el.dataset.id; if (!canRead()) state.tab = 'queries'; }
  else if (action === 'lineage') state.lineageId = el.dataset.id;
  else if (action === 'docs') state.docsOpen = !state.docsOpen;
  else if (action === 'edit-tags') state.tagEdit = !state.tagEdit;
  else if (action === 'drop-tag') state.tags = state.tags.filter((t) => t !== el.dataset.tag);
  if (action !== 'request' && action !== 'next') render();
}
function exportCsv() {
  const rows = visibleRequests();
  const header = ['Номер', 'Статус', 'Автор', 'Получатели', 'Дата', 'Гранты', 'Объект'];
  const lines = [header].concat(rows.map((r) => [r.id, r.status, r.author, r.recipients.join('; '), fmt(r.iso), r.grants.join(' '), 'hive:prod-cluster.core.dim_account_h']));
  const csv = lines.map((line) => line.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dim_account_h-source-requests.csv';
  a.id = 'dl';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  toast('Скачан CSV по ' + rows.length + ' заявкам');
}
function copyText(text) {
  const done = () => toast('Скопировано');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
  function fallback() {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    area.remove();
    done();
  }
}
document.body.addEventListener('click', onClick);
document.body.addEventListener('change', (e) => {
  if (e.target.id !== 'scenario-select') return;
  state.scenario = e.target.value;
  state.pending = null;
  state.page = 1;
  state.ranQuery = null;
  state.drawerId = null;
  state.modal = null;
  render();
});
document.body.addEventListener('input', (e) => {
  if (e.target.id === 'search') { state.search = e.target.value; state.searchOpen = true; renderChrome(); }
  if (e.target.id === 'req-q') { state.searchQuery = e.target.value; state.page = 1; render(); const again = document.getElementById('req-q'); if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); } }
  if (e.target.id === 'new-tag') return;
});
document.body.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { state.modal = null; state.drawerId = null; state.searchOpen = false; state.helpOpen = false; state.viewsOpen = false; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('search').focus(); state.searchOpen = true; renderChrome(); }
  if (e.key === 'Enter' && e.target.id === 'new-tag') {
    const value = e.target.value.trim();
    if (value && !state.tags.includes(value)) state.tags.push(value);
    state.tagEdit = false;
    render();
  }
  if (e.key === 'Enter' && e.target.dataset.action === 'open-request') e.target.click();
});
document.body.addEventListener('submit', (e) => {
  if (e.target.id !== 'steward-form') return;
  e.preventDefault();
  state.modal = null;
  render();
  toast('Сообщение отправлено стюарду anna.steward');
});
document.getElementById('search-form').addEventListener('submit', (e) => {
  e.preventDefault();
  state.route = 'dataset';
  state.searchOpen = false;
  render();
  toast('Найдите dim_account_h — у этой таблицы разобран доступ к Hive');
});
document.getElementById('search').addEventListener('focus', () => { state.searchOpen = true; renderChrome(); });
render();
